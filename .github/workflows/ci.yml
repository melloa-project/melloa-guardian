name: Guardian CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify formatting, static analysis, and tests
        run: make check
      - name: Build reproducible-path CLI
        run: make build
      - name: Exercise owner-controlled public preview handoff
        run: make preview-state-test
